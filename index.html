body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;margin:0}

.notice{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:color-mix(in srgb,var(--teal) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--teal) 40%,var(--line));border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}

.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}

.pill.bad,.st.bad{background:var(--bad-bg);color:var(--bad)}

.big small{font-size:13px;font-weight:400;color:var(--muted);font-family:var(--font)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 6px}

.kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:11px;font-weight:400;color:var(--muted);font-family:var(--font)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.note.alert{color:var(--warn)}
.tbl{overflow-x:auto;margin-top:8px}
.fit,.quote{margin-top:18px}
.fit .head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
tr.cur td{background:color-mix(in srgb,var(--brand) 10%,transparent)}
.cat{font-size:11px;color:var(--muted)}
.gpu-name{font-weight:500;white-space:nowrap}
.quote .qgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:820px){.quote .qgrid{grid-template-columns:minmax(0,1fr)}}
.qsum{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:inherit;font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:var(--r);border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:transparent;color:var(--brand-ink)}
.promise{margin-top:10px;padding:10px 12px;border-radius:var(--r);background:var(--ok-bg);color:var(--ok);font-size:13px;font-weight:500}
.contact{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.qr{width:132px;height:132px;background:#fff;padding:6px;border-radius:var(--r);flex:0 0 auto}
.qr img,.qr canvas{display:block;width:120px;height:120px}
.contact .txt{font-size:13px;min-width:0}
.contact .txt b{font-family:var(--mono);font-weight:600;user-select:all}
.toast{font-size:12.5px;color:var(--ok);min-height:1.2em;margin-top:6px}
.faqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px 24px}
.faqs h3{font-size:14px;font-weight:600;margin:0 0 4px;text-wrap:balance}
.faqs p{margin:0;font-size:13px;color:var(--muted);line-height:1.55}
footer{margin-top:28px;color:var(--muted);font-size:12px;line-height:1.6;max-width:72ch}
footer a{color:var(--brand-ink)}
@media(prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>

<div class="wrap">
<header>
  <div class="brand">

      <h1>LLM Sizing Calculator</h1>

    <div class="seg lang" role="group" aria-label="Language"><button type="button" id="lTh" aria-pressed="true">ไทย</button><button type="button" id="lEn" aria-pressed="false">EN</button></div>

</header>

<div class="notice"><span><b data-i18n="freeTitle"></b> <span data-i18n="freeBody"></span> <a href="https://www.kl-itonline.com" target="_blank" rel="noopener">kl-itonline.com →</a></span></div>

<div class="seg modes" role="group" aria-label="Mode">
  <button type="button" id="mInf" aria-pressed="true">Inference</button>
  <button type="button" id="mFt" aria-pressed="false">Fine-tuning</button>
</div>

<div class="grid">
<section class="panel" aria-label="Settings">
  <h2 data-i18n="h.model"></h2>
  <div class="field">
    <label for="model" data-i18n="l.model"></label>
    <select id="model"></select>
    <span class="hint" id="modelHint"></span>
  </div>
  <details id="customWrap"><summary data-i18n="l.custom"></summary>
    <div class="row3" style="margin-top:10px">
      <div class="field"><label for="cParams">Params (B)</label><input id="cParams" type="number" step="0.1" min="0.1"></div>
      <div class="field"><label for="cActive">Active (B)</label><input id="cActive" type="number" step="0.1" min="0.1"></div>
      <div class="field"><label for="cLayers">Layers</label><input id="cLayers" type="number" step="1" min="1"></div>
    </div>
    <div class="row">
      <div class="field"><label for="cKV">KV heads</label><input id="cKV" type="number" step="1" min="1"></div>
      <div class="field"><label for="cHD">Head dim</label><input id="cHD" type="number" step="1" min="1"></div>
    </div>
    <span class="hint" data-i18n="h.customHint"></span>
  </details>

  <div id="infFields">
    <div class="row" style="margin-top:12px">
      <div class="field"><label for="quant">Weight quantization</label><select id="quant"></select></div>
      <div class="field"><label for="kvq">KV cache precision</label><select id="kvq"></select></div>
    </div>
    <div class="field">
      <label for="ctx">Context length (tokens)</label>
      <input id="ctx" type="number" min="256" step="256" value="8192">
      <div class="chips" id="ctxChips"></div>
    </div>
    <div class="row">
      <div class="field"><label for="users" data-i18n="l.users"></label><input id="users" type="number" min="1" max="256" value="1"><span class="hint" data-i18n="h.users"></span></div>
      <div class="field"><label for="prompt" data-i18n="l.prompt"></label><input id="prompt" type="number" min="16" step="256" value="1024"><span class="hint">tokens</span></div>
    </div>
  </div>

  <div id="ftFields" hidden>
    <div class="row" style="margin-top:12px">
      <div class="field"><label for="ftm" data-i18n="l.ftm"></label><select id="ftm">
        <option value="qlora">QLoRA (base 4-bit)</option><option value="lora">LoRA (base BF16)</option><option value="full">Full fine-tune (BF16 mixed)</option></select></div>
      <div class="field"><label for="rank">LoRA rank</label><select id="rank"><option>8</option><option selected>16</option><option>32</option><option>64</option><option>128</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label for="seq">Sequence length</label><input id="seq" type="number" min="128" step="128" value="2048"></div>
      <div class="field"><label for="bs" data-i18n="l.bs"></label><input id="bs" type="number" min="1" max="128" value="2"></div>
    </div>
    <label class="cb"><input id="gck" type="checkbox" checked> <span data-i18n="l.gck"></span></label>
    <label class="cb"><input id="fa" type="checkbox" checked> FlashAttention / SDPA</label>
    <label class="cb"><input id="opt8" type="checkbox"> <span data-i18n="l.opt8"></span></label>
    <div class="field"><label for="ds" data-i18n="l.ds"></label><input id="ds" type="number" min="0.1" step="1" value="10"></div>
  </div>

  <h2 style="margin-top:6px" data-i18n="h.hw"></h2>
  <div class="field">
    <label for="gpu">GPU</label>
    <select id="gpu"></select>
    <span class="hint" id="gpuHint"></span>
  </div>
  <div class="row">
    <div class="field"><label for="ngpu" data-i18n="l.ngpu"></label><select id="ngpu"><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option></select><span class="hint" id="ngpuHint"></span></div>

  </div>
  <label class="cb" id="offWrap"><input id="offload" type="checkbox"> <span data-i18n="l.offload"></span></label>
</section>

<section class="panel" aria-label="Results" aria-live="polite">

      <div class="row">
        <div class="field"><label for="qType" data-i18n="q.type"></label><select id="qType">

        <div class="field"><label for="qCpu">CPU platform</label><select id="qCpu">

  ['Which GPU can run Llama 70B?','At Q4 you need 48 GB or more: an RTX PRO 6000 Blackwell (96 GB) runs it comfortably on one card, an RTX PRO 5000 48 GB or RTX 6000 Ada fits tightly, or use two GeForce RTX 5090/4090. Full FP16 needs 2× H100/H200 or 2× RTX PRO 6000.'],
  ['RTX PRO 6000 vs RTX 5090 for AI work?','Similar Blackwell silicon and the same memory bandwidth, but the PRO 6000 has 96 GB (the 5090 has 32 GB), so it runs 70B models on one card; it also adds ECC, workstation drivers, a blower cooler for multi-GPU builds and 24×7 duty rating. The 5090 is the value pick for models up to ~32B.'],
  ['Workstation or server?','A workstation (HP Z, Dell Precision, Lenovo P) suits 1–4 GPUs, sits in the office, runs quietly and costs less: ideal for development, experiments and serving a small team. A rack server makes sense at 4–8 GPUs, dozens of concurrent users, redundancy requirements and data-center placement.'],

  $('faqs').innerHTML=t('faq').map(([q,a])=>`<div><h3>${q}</h3><p>${a}</p></div>`).join('');
  fillSelects();
}
// URL presets: ?gpu=pro6000&model=l3.3-70b&mode=ft&lang=en
(function(){try{
  const u=new URLSearchParams(location.search);
  if(u.get('lang')==='en'||u.get('lang')==='th'){lang=u.get('lang')}
  window.__preset={gpu:u.get('gpu'),model:u.get('model'),mode:u.get('mode')};
}catch(e){window.__preset={}}})();

function curModel(){
  const base=MODELS.find(m=>m.id===$('model').value);
  const m={...base};
  if(base.id==='custom'||$('customWrap').open){
    const v=(id,d)=>{const x=parseFloat($(id).value);return isFinite(x)&&x>0?x:d};
    m.p=v('cParams',base.p);m.a=v('cActive',base.a);m.L=v('cLayers',base.L);m.kv=v('cKV',base.kv);m.hd=v('cHD',base.hd);
    if(base.id==='custom'){m.mla=false;m.swa=null}
  }
  m.h=Math.round(Math.sqrt((m.a*1e9)/(12*m.L))/128)*128||1024;
  m.name=modelName(m);
  return m;
}
function curGPU(){return GPUS.find(g=>g.id===$('gpu').value)}
function usable(g){return (g.c==='ot'&&g.id!=='custom'&&g.bw<1000)?0.75:USABLE}
const sec=x=>x<1?Math.round(x*1000)+' ms':fmt(x,1)+' s';

// ---------- inference ----------
function estInf(m,g,n,o){
  const P=t('p'),K=t('k'),S=t('sInf');
  const qb=QUANTS.find(q=>q.id===o.quant).b, kb=KVQ.find(q=>q.id===o.kvq).b;
  const weights=m.p*1e9*qb;
  let kvTok=m.mla?m.L*m.hd*kb:2*m.L*m.kv*m.hd*kb;
  let kvEff=kvTok*o.ctx;
  if(m.swa){const local=kvTok*m.swa.f,global=kvTok*(1-m.swa.f);kvEff=global*o.ctx+local*Math.min(o.ctx,m.swa.w)}
  const kv=kvEff*o.users;
  const activeBytes=m.a*1e9*qb;
  const act=Math.max(0.3*GB,0.07*activeBytes)+o.users*VOCAB*4;
  const runtime=n*(0.8*GB+(n>1?0.5*GB:0));
  const overhead=act+runtime, total=weights+kv+overhead;
  const uf=usable(g), cap=g.v*GiB*n*uf, fits=total<=cap, over=Math.max(0,total-cap);
  const bwTot=g.bw*GB*n*(n>1?0.85:1)*o.eff;
  const tfTot=g.tf*1e12*n*(n>1?0.9:1)*0.45;
  const kvRead=kvEff*0.5;
  let memT;
  if(fits||!o.offload){memT=(activeBytes+o.users*kvRead)/bwTot}
  else{const onGpu=Math.max(0,activeBytes-over*(m.a/m.p));memT=onGpu/bwTot+(activeBytes-onGpu)/(45*GB)+o.users*kvRead/bwTot}
  const compT=o.users*2*m.a*1e9/tfTot;
  const step=Math.max(memT,compT);
  const ttft=tok=>tok*2*m.a*1e9/tfTot+0.02+(fits||!o.offload?0:tok*0.002);
  const free=cap-weights-overhead, perTok=m.swa?kvTok*(1-m.swa.f):kvTok;
  const maxCtx=free>0?Math.floor(free/(perTok*o.users)):0;
  return {total,cap,fits,over,uf,speed:1/step,maxCtx,
    parts:[[P.w,weights,'var(--w)',P.wB(fmt(m.p,2),qb),'w'],
           [P.kv,kv,'var(--k)',P.kvB(fmt(kvTok/1024,1),fmt0(o.ctx),o.users,!!m.swa),'kv'],
           [P.act,act,'var(--o)',P.actB,'o'],
           [P.rt,runtime,'var(--o)',P.rtB(n,'0.8'),'o']],
    kpis:[[K.tpsUser,`${fmt(1/step,1/step<10?1:0)}<small> tok/s</small>`],
          [K.tpsAll,`${fmt(o.users/step,o.users/step<10?1:0)}<small> tok/s</small>`],
          [K.ttft,sec(ttft(o.prompt))],[K.ttftFull,sec(ttft(o.ctx))],
          [K.kvTok,`${fmt(kvTok/1024,1)}<small> KB</small>`],
          [K.maxCtx,maxCtx>0?`${maxCtx>=1024?fmt0(maxCtx/1024)+'K':fmt0(maxCtx)}<small> ${t('tokUser')}</small>`:'—']],
    desc:`${m.name} · ${QUANTS.find(q=>q.id===o.quant).n} · ${fmt0(o.ctx)} tokens × ${o.users} ${o.users>1?t('users'):t('user')} ${t('on')} ${n}× ${gpuName(g)}`,
    speedNote:((!fits&&o.offload)?S.offl:(compT>memT?S.comp:S.mem))+(m.a<m.p?S.moe:'')};
}

// ---------- fine-tuning ----------
function estFT(m,g,n,o){
  const P=t('p'),K=t('k'),S=t('sFt');
  const Pn=m.p*1e9, shard=n;
  let base,grad,opt,master,trainable,desc;
  if(o.ftm==='full'){
    base=Pn*2; grad=Pn*2; master=Pn*4; opt=Pn*(o.opt8?2:8); trainable=Pn;
    desc='Full FT BF16 mixed'+(o.opt8?' · 8-bit AdamW':'');
  }else{
    trainable=o.rank*2*m.h*7*m.L;
    base=Pn*(o.ftm==='qlora'?0.56:2); grad=trainable*2; master=trainable*4; opt=trainable*8;
    desc=(o.ftm==='qlora'?'QLoRA (NF4 base)':'LoRA (BF16 base)')+` r=${o.rank}`;
  }
  const states=(grad+master+opt)/shard, baseS=base/shard;
  const s=o.seq,b=o.bs,h=m.h;
  const perLayerFull=s*b*h*34;
  const attnScores=o.fa?0:s*s*b*(h/128)*2;
  const act=o.gck?(m.L*s*b*h*2+perLayerFull+attnScores):m.L*(perLayerFull+attnScores);
  const logits=s*b*VOCAB*8;
  const runtime=n*(1.2*GB+(n>1?0.6*GB:0));
  const total=baseS+states+act+logits+runtime;
  const uf=usable(g), cap=g.v*GiB*uf, fits=total<=cap, over=Math.max(0,total-cap);
  const flopsTok=(o.ftm==='full'?6:4)*m.a*1e9+(o.gck?2*m.a*1e9:0);
  const mfu=o.ftm==='full'?0.40:o.ftm==='lora'?0.32:0.25;
  const tfTot=g.tf*1e12*n*(n>1?0.88:1)*mfu;
  const tps=fits?tfTot/flopsTok:0;
  const epochH=tps?o.ds*1e6/tps/3600:0;
  const stepT=tps?s*b*n/tps:0;
  const maxBs=Math.max(0,Math.floor((cap-baseS-states-runtime)/((act+logits)/b)));
  const sh=n>1?P.sharded(n):'';
  return {total,cap,fits,over,uf,speed:tps,maxBs,
    parts:[[P.base+sh,baseS,'var(--w)',o.ftm==='qlora'?P.nf4(fmt(m.p,2)):P.bf16(fmt(m.p,2)),'w'],
           [P.states+sh,states,'var(--g)',o.ftm==='full'?P.full(o.opt8?'10':'14',fmt(m.p,2)):P.lora(fmt0(trainable/1e6)),'states'],
           [P.actFt,act,'var(--k)',P.actFtB(fmt0(s),b,m.L,o.gck,o.fa),'act'],
           [P.logits,logits,'var(--o)',P.logB(fmt0(s*b),fmt0(VOCAB)),'o'],
           [P.rt,runtime,'var(--o)',P.rtB(n,'1.2'),'o']],
    kpis:[[K.thr,`${fmt0(tps)}<small> tok/s</small>`],
          [K.epoch,epochH?(epochH<1?Math.round(epochH*60)+' '+t('min'):fmt(epochH,1)+' '+t('hr')):'—'],
          [K.step,stepT?sec(stepT):'—'],
          [K.train,`${trainable>=1e9?fmt(trainable/1e9,2)+'B':fmt0(trainable/1e6)+'M'}`],
          [K.frac,`${fmt(trainable/Pn*100,trainable/Pn<0.01?2:0)}<small> %</small>`],
          [K.maxBs,maxBs>0?`${maxBs}`:'—']],
    desc:`${m.name} · ${desc} · seq ${fmt0(s)} × batch ${b} ${t('on')} ${n}× ${gpuName(g)}`,
    speedNote:S.mfu(Math.round(mfu*100))+S[o.ftm]+(o.gck?S.gck:'')+(n>1?S.multi:'')+(m.a<m.p?S.moe:'')};
}

function opts(){return {
  quant:$('quant').value,kvq:$('kvq').value,ctx:Math.max(256,parseInt($('ctx').value)||8192),users:Math.max(1,parseInt($('users').value)||1),prompt:Math.max(16,parseInt($('prompt').value)||1024),eff:parseFloat($('eff').value),offload:mode==='inf'&&$('offload').checked,
  ftm:$('ftm').value,rank:parseInt($('rank').value),seq:Math.max(128,parseInt($('seq').value)||2048),bs:Math.max(1,parseInt($('bs').value)||1),gck:$('gck').checked,fa:$('fa').checked,opt8:$('opt8').checked,ds:Math.max(0.1,parseFloat($('ds').value)||10)}}
const est=(m,g,n,o)=>mode==='inf'?estInf(m,g,n,o):estFT(m,g,n,o);

function setMode(k){
  mode=k;$('mInf').setAttribute('aria-pressed',k==='inf');$('mFt').setAttribute('aria-pressed',k==='ft');
  $('infFields').hidden=k!=='inf';$('ftFields').hidden=k!=='ft';$('effWrap').hidden=k!=='inf';$('offWrap').hidden=k!=='inf';
  update();
}

function update(){
  const m=curModel(),g=curGPU(),n=parseInt($('ngpu').value),o=opts(),ft=mode==='ft';
  $('ngpuHint').textContent=t(ft?'ngpuFt':'ngpuInf');$('resTitle').textContent=t(ft?'resFt':'resInf');
  $('modelHint').textContent=`${fmt(m.p,2)}B params${m.a!==m.p?` · active ${fmt(m.a,1)}B`:''} · ${m.L} layers · ${m.mla?'MLA 576 dims':`${m.kv} KV heads × ${m.hd}`}${m.swa?' · sliding-window':''}${ft?` · hidden ≈ ${fmt0(m.h)}`:''}`;
  $('gpuHint').textContent=`${g.v} GB · ${fmt0(g.bw)} GB/s · ~${g.tf} TFLOPS FP16${g.tdp?` · ${g.tdp} W`:''}${g.note?' · '+g.note[lang]:''}`;
  [...$('ctxChips').children].forEach(b=>b.setAttribute('aria-pressed',parseInt(b.dataset.v)===o.ctx));
  const r=est(m,g,n,o);
  const pill=$('pill'),pct=r.total/r.cap;
  if(r.fits&&pct<=0.85){pill.className='pill ok';pill.textContent=t('ok')}
  else if(r.fits){pill.className='pill warn';pill.textContent=t('tight')}
  else if(o.offload){pill.className='pill warn';pill.textContent=t('offl')(fmt(r.over/GB))}
  else{pill.className='pill bad';pill.textContent=t('bad')(fmt(r.over/GB),ft)}
  $('for').textContent=r.desc;
  $('vramBig').innerHTML=`${fmt(r.total/GB)} <small>GB ${t(ft?'perCard':'need')}</small>`;
  $('vramCap').textContent=ft?t('capFt')(fmt(r.cap/GB),Math.round(r.uf*100)):t('capInf')(fmt(r.cap/GB),n*g.v,Math.round(r.uf*100));
  const scale=Math.max(r.total,r.cap);
  const bar=$('bar');bar.querySelectorAll('span').forEach(e=>e.remove());
  r.parts.forEach(([,b,col])=>{const s=document.createElement('span');s.style.width=(b/scale*100)+'%';s.style.background=col;bar.insertBefore(s,$('capline'))});
  $('capline').style.left=(r.cap/scale*100)+'%';
  const seen=new Set(),LG=t('lg');$('legend').innerHTML=r.parts.filter(p=>!seen.has(p[4])&&seen.add(p[4])).map(p=>`<span><i style="background:${p[2]}"></i>${LG[p[4]]}</span>`).join('');
  $('kpis').innerHTML=r.kpis.map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
  $('breakdown').innerHTML=r.parts.map(([a,b,,c])=>`<tr><td>${a}</td><td class="n">${fmt(b/GB)}</td><td class="cat">${c}</td></tr>`).join('')+`<tr style="font-weight:600"><td>${t('total')}${ft?' '+t('perCard'):''}</td><td class="n">${fmt(r.total/GB)}</td><td></td></tr>`;
  let note='';
  if(!r.fits&&!o.offload){
    if(!ft){
      const need=Math.ceil(r.total/(g.v*GiB*r.uf));note=t('opt')+t('use')(need,gpuName(g));
      const lighter=QUANTS.filter(q=>q.b<QUANTS.find(x=>x.id===o.quant).b).find(q=>estInf(m,g,n,{...o,quant:q.id}).fits);
      if(lighter)note+=t('orQuant')(lighter.n);
      if(r.maxCtx>0)note+=t('orCtx')(fmt0(r.maxCtx));
    }else{
      const alt=[];
      for(const nn of [2,4,8]){if(nn>n&&estFT(m,g,nn,o).fits){alt.push(t('ftUse')(nn,gpuName(g)));break}}
      if(o.ftm==='full'&&estFT(m,g,n,{...o,ftm:'lora'}).fits)alt.push(t('toLora'));
      if(o.ftm!=='qlora'&&estFT(m,g,n,{...o,ftm:'qlora'}).fits)alt.push(t('toQlora'));
      if(!o.gck&&estFT(m,g,n,{...o,gck:true}).fits)alt.push(t('onGck'));
      if(o.bs>1&&estFT(m,g,n,{...o,bs:1}).fits)alt.push(t('bs1'));
      if(o.seq>512&&estFT(m,g,n,{...o,seq:Math.max(512,o.seq/2)}).fits)alt.push(t('halfSeq')(fmt0(Math.max(512,o.seq/2))));
      note=alt.length?t('opt')+alt.join(' · '):t('noFit');
    }
  }else if(r.fits&&pct>0.85){note=t('tightNote')(ft)}
  $('noteMain').textContent=note;$('noteMain').className='note'+(note?' alert':'');
  $('noteSpeed').textContent=r.speedNote;
  renderFit(m,o);
  $('qGpu').value=`${n}× ${gpuName(g)}`;
  buildQuote();
}

function renderFit(m,o){
  m=m||curModel();o=o||opts();
  const cur=$('gpu').value,CN=t('catName');
  $('fitHint').textContent=t(mode==='inf'?'fitInf':'fitFt');
  const rows=GPUS.filter(g=>g.id!=='custom'&&(catFilter==='all'||g.c===catFilter)).map(g=>{
    let best=null;
    for(const n of [1,2,3,4,6,8]){const r=est(m,g,n,{...o,offload:false});if(r.fits){best={n,r};break}}
    return {g,best};
  });
  rows.sort((a,b)=>{const an=a.best?a.best.n:99,bn=b.best?b.best.n:99;if(an!==bn)return an-bn;return (b.best?b.best.r.speed:0)-(a.best?a.best.r.speed:0)});
  $('fitBody').innerHTML=rows.map(({g,best})=>{
    let st,cls;
    if(!best){st=t('stNo');cls='bad'}
    else if(best.n===1){const p=best.r.total/best.r.cap;st=p>0.85?t('stTight'):t('stOk');cls=p>0.85?'warn':'ok'}
    else{st=t('stN')(best.n);cls='warn'}
    const sp=best?(best.r.speed<10?fmt(best.r.speed,1):fmt0(best.r.speed)):'—';
    return `<tr class="${g.id===cur?'cur':''}"><td><div class="gpu-name">${g.n}</div><div class="cat">${CN[g.c].split(' (')[0]}</div></td><td class="n">${g.v} GB</td><td class="n">${fmt0(g.bw)}</td><td class="n">${g.tdp?g.tdp+' W':'—'}</td><td class="n">${best?best.n:'—'}</td><td class="n">${best?fmt(best.r.total/GB,0)+' / '+fmt(best.r.cap/GB,0):'—'}</td><td class="n">${sp}</td><td><span class="st ${cls}">${st}</span></td></tr>`;
  }).join('');
}

// ---------- quote ----------
const EMAIL='sales@klmogroup.com', LINE_ID='@462lkloe';
function buildQuote(){
  const m=curModel(),g=curGPU(),n=parseInt($('ngpu').value),o=opts(),r=est(m,g,n,o),M=t('m');
  const v=id=>$(id).value.trim();
  const L=[M.title,'',`${M.name}: ${v('qName')||'-'}`,`${M.contact}: ${v('qContact')||'-'}`,'',M.spec,
    `${M.type}: ${v('qType')} × ${v('qQty')||1}`,
    `${M.cpu}: ${v('qCpu')}${v('qCores')?` · ${v('qCores')} ${M.cores}`:''}${v('qClock')?` · ${v('qClock')} GHz`:''}`,
    `${M.ram}: ${v('qRam')?v('qRam')+' GB':M.rec}`,
    `${M.disk}: ${v('qDisk')?v('qDisk')+' TB ':''}${v('qDiskT')}`,
    `${M.gpu}: ${v('qGpu')}`];
  if(v('qNote'))L.push(`${M.note}: ${v('qNote')}`);
  L.push('',M.res,`${M.mode}: ${mode==='inf'?'Inference':'Fine-tuning'}`,`${M.cfg}: ${r.desc}`,
    `${M.vram}: ${fmt(r.total/GB)} GB${mode==='ft'?' '+t('perCard'):''} / ${M.usable} ${fmt(r.cap/GB)} GB → ${r.fits?M.fits:M.short(fmt(r.over/GB))}`,
    `${M.speed}: ${mode==='inf'?fmt(r.speed,r.speed<10?1:0)+' '+M.perUser:fmt0(r.speed)+' '+M.training}`);
  const txt=L.join('\n');
  $('qText').value=txt;
  $('mailBtn').href=`mailto:${EMAIL}?subject=${encodeURIComponent(M.subj(v('qName')))}&body=${encodeURIComponent(txt)}`;
}
$('qform').addEventListener('submit',e=>{e.preventDefault();buildQuote();$('toast').textContent=t('built');$('qText').focus()});
['qType','qCpu','qCores','qClock','qRam','qDisk','qDiskT','qQty','qGpu','qName','qContact','qNote'].forEach(id=>$(id).addEventListener('input',buildQuote));
$('copyBtn').addEventListener('click',async()=>{
  const x=$('qText');
  try{await navigator.clipboard.writeText(x.value);$('toast').textContent=t('copied')(EMAIL)}
  catch(e){x.focus();x.select();$('toast').textContent=t('selected')}
});
try{new QRCode($('qr'),{text:'https://line.me/R/ti/p/%40462lkloe',width:120,height:120,correctLevel:QRCode.CorrectLevel.M})}catch(e){$('qr').textContent='LINE '+LINE_ID}

function seedCustom(){const b=MODELS.find(m=>m.id===$('model').value);$('cParams').value=b.p;$('cActive').value=b.a;$('cLayers').value=b.L;$('cKV').value=b.mla?1:b.kv;$('cHD').value=b.hd;if(b.id==='custom')$('customWrap').open=true}

try{const s=localStorage.getItem('klit-lang');if((s==='en'||s==='th')&&!new URLSearchParams(location.search).get('lang'))lang=s}catch(e){}
applyLang();
if(window.__preset){const p=window.__preset;if(p.gpu&&GPUS.some(g=>g.id===p.gpu))$('gpu').value=p.gpu;if(p.model&&MODELS.some(m=>m.id===p.model))$('model').value=p.model}
seedCustom();
$('model').addEventListener('change',()=>{seedCustom();update()});
['quant','kvq','ctx','users','prompt','gpu','ngpu','eff','offload','cParams','cActive','cLayers','cKV','cHD','ftm','rank','seq','bs','gck','fa','opt8','ds'].forEach(id=>$(id).addEventListener('input',update));
$('customWrap').addEventListener('toggle',update);
$('mInf').onclick=()=>setMode('inf');$('mFt').onclick=()=>setMode('ft');
const setLang=l=>{lang=l;try{localStorage.setItem('klit-lang',l)}catch(e){}applyLang();update()};
$('lTh').onclick=()=>setLang('th');$('lEn').onclick=()=>setLang('en');
setMode(window.__preset&&window.__preset.mode==='ft'?'ft':'inf');
</script>
